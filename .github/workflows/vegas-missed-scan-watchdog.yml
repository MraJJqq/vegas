name: vegas-missed-scan-watchdog

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: vegas-missed-scan-watchdog
  queue: max

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Detect and recover a missed Beijing scan slot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: MraJJqq/vegas
          WORKFLOW: vegas-scan.yml
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          repo = os.environ["REPO"]
          workflow = os.environ["WORKFLOW"]
          token = os.environ["GH_TOKEN"]
          api = "https://api.github.com"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request(url, method="GET", payload=None, accept=None):
              h = dict(headers)
              if accept:
                  h["Accept"] = accept
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(url, data=data, headers=h, method=method)
              with urllib.request.urlopen(req, timeout=20) as response:
                  body = response.read()
                  return response.status, body

          tz = ZoneInfo("Asia/Shanghai")
          now = datetime.now(tz)
          slots = [(8, 5), (10, 5), (16, 5), (20, 5), (22, 5)]
          candidates = [
              now.replace(hour=h, minute=m, second=0, microsecond=0)
              for h, m in slots
          ]
          due = max((value for value in candidates if value <= now), default=None)
          if due is None:
              print("No scan slot is due today yet; previous-day slots are never recovered.")
              sys.exit(0)

          # Give the normal scheduled scan ten minutes to start and publish.
          if now < due + timedelta(minutes=10):
              print(f"Within grace period for {due.isoformat()}; no recovery needed.")
              sys.exit(0)

          try:
              status, raw = request(
                  f"{api}/repos/{repo}/contents/signals.json?ref=main",
                  accept="application/vnd.github.raw+json",
              )
              result = json.loads(raw.decode("utf-8"))
              generated = datetime.strptime(
                  result["generated_at"].replace(" (UTC+8)", ""),
                  "%Y-%m-%d %H:%M:%S",
              ).replace(tzinfo=tz)
          except Exception as exc:
              print(f"signals.json unavailable or invalid: {exc}; recovery required.")
              generated = None

          if generated is not None and generated >= due:
              print(
                  f"Slot covered: due={due.isoformat()} "
                  f"latest_scan={generated.isoformat()}"
              )
              sys.exit(0)

          status, raw = request(
              f"{api}/repos/{repo}/actions/workflows/{workflow}/runs"
              "?branch=main&per_page=20"
          )
          runs = json.loads(raw.decode("utf-8")).get("workflow_runs", [])
          active = [
              run for run in runs
              if run.get("status") in ("queued", "in_progress", "requested", "waiting")
          ]
          if active:
              print(
                  "Recovery skipped; Vegas scan already active/queued: "
                  + ", ".join(str(run.get("id")) for run in active)
              )
              sys.exit(0)

          print(
              f"MISSED_SLOT: due={due.isoformat()} "
              f"latest_scan={generated.isoformat() if generated else 'unavailable'}"
          )
          status, _ = request(
              f"{api}/repos/{repo}/actions/workflows/{workflow}/dispatches",
              method="POST",
              payload={"ref": "main", "inputs": {"bark_recovery": "false"}},
          )
          print(f"Vegas recovery dispatch accepted: HTTP {status}")
          PY
