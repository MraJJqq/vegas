name: Vegas Scheduled Scan

on:
  schedule:
    - cron: "5 0,2,8,12,14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vegas-cache
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate scanner code and rules
        run: |
          python -m py_compile src/vegas.py
          python -m unittest discover -s tests -v
      - name: Download persistent market cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download market-cache --pattern "market-cache.sqlite.gz" --dir .
          gzip -dc market-cache.sqlite.gz > market-cache.sqlite
      - name: Update history and scan
        run: python src/vegas.py scan
      - name: Update persistent cache asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gzip -c market-cache.sqlite > market-cache.sqlite.gz
          gh release upload market-cache market-cache.sqlite.gz --clobber
      - name: Publish signal file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/signals.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Vegas daily signal output"
            git push
          fi
