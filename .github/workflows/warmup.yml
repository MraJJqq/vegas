name: Vegas History Warmup

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vegas-cache
  cancel-in-progress: false

jobs:
  warmup:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate scanner code and rules
        run: |
          python -m py_compile src/vegas.py
          python -m unittest discover -s tests -v
      - name: Validate and download full Bitget history
        run: python src/vegas.py warmup
      - name: Compress persistent SQLite cache
        run: gzip -c market-cache.sqlite > market-cache.sqlite.gz
      - name: Publish cache release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view market-cache >/dev/null 2>&1; then
            gh release upload market-cache market-cache.sqlite.gz --clobber
          else
            gh release create market-cache market-cache.sqlite.gz --title "Vegas market cache" --notes "Persistent Bitget 1H/4H history cache. Updated by Vegas workflows."
          fi
