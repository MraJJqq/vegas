name: vegas-scan

on:
  schedule:
    # Re-registered schedule: Beijing time 08:05 / 10:05 / 16:05 / 20:05 / 22:05
    - cron: "5 0,2,8,12,14 * * *"
  workflow_dispatch:
    inputs:
      bark_recovery:
        description: "This run was requested by Bark recovery"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: write

concurrency:
  group: vegas-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify latest main and record trigger
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          git fetch origin main
          remote_sha=$(git rev-parse origin/main)
          echo "EVENT_NAME=$EVENT_NAME"
          echo "SCHEDULE_CRON=${SCHEDULE_CRON:-manual-or-dispatch}"
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "REMOTE_MAIN_SHA=$remote_sha"
          if [ "$GITHUB_SHA" != "$remote_sha" ]; then
            echo "STALE_RUN_BLOCKED: this run is not based on the current main head"
            exit 1
          fi
          echo "RUN_HEAD_VALID"
      - name: Install dependencies
        run: pip install requests
      - name: Validate scanner and symbol list
        run: |
          python -m py_compile scan.py
          count=$(grep -Ev '^[[:space:]]*(#|$)' symbols.txt | sort -u | wc -l)
          test "$count" -eq 22
      - name: Download and import full-history SQLite cache
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            https://github.com/MraJJqq/vegas/releases/download/market-cache/market-cache.sqlite.gz \
            --output /tmp/market-cache.sqlite.gz
          gzip -t /tmp/market-cache.sqlite.gz
          gunzip -c /tmp/market-cache.sqlite.gz > /tmp/market-cache.sqlite
          python - <<'PY'
          import csv
          import os
          import sqlite3
          import time

          db = sqlite3.connect("file:/tmp/market-cache.sqlite?mode=ro", uri=True)
          integrity = db.execute("PRAGMA integrity_check").fetchone()[0]
          if integrity != "ok":
              raise SystemExit(f"SQLite integrity check failed: {integrity}")

          tables = {row[0] for row in db.execute(
              "SELECT name FROM sqlite_master WHERE type='table'"
          )}
          if "candles" not in tables:
              raise SystemExit("SQLite cache has no candles table")

          symbols = [
              line.strip() for line in open("symbols.txt", encoding="utf-8")
              if line.strip() and not line.lstrip().startswith("#")
          ]
          steps = {"1H": 3_600_000, "4H": 14_400_000}
          now = int(time.time() * 1000)
          os.makedirs("data", exist_ok=True)
          total = 0

          for symbol in symbols:
              for interval, step in steps.items():
                  rows = db.execute(
                      """SELECT ts,open,high,low,close
                         FROM candles
                         WHERE contract=? AND interval=?
                         ORDER BY ts""",
                      (symbol, interval)
                  ).fetchall()
                  path = f"data/{symbol}_{interval}.csv"
                  merged = {
                      int(row[0]): tuple(row)
                      for row in rows if int(row[0]) + step <= now
                  }
                  # Preserve candles fetched after the release snapshot and
                  # previously committed incremental cache rows.
                  if os.path.exists(path):
                      with open(path, newline="", encoding="utf-8") as handle:
                          for row in csv.DictReader(handle):
                              ts = int(row["t"])
                              if ts + step <= now:
                                  merged[ts] = (
                                      ts, float(row["o"]), float(row["h"]),
                                      float(row["l"]), float(row["c"])
                                  )
                  closed = [merged[ts] for ts in sorted(merged)]
                  minimum = 676 if interval == "4H" else 60
                  if len(closed) < minimum:
                      raise SystemExit(
                          f"Cache history insufficient: {symbol} {interval} "
                          f"{len(closed)}/{minimum}"
                      )
                  with open(path, "w", newline="", encoding="utf-8") as handle:
                      writer = csv.writer(handle)
                      writer.writerow(["t", "o", "h", "l", "c"])
                      writer.writerows(closed)
                  print(
                      f"IMPORTED {symbol} {interval}: "
                      f"{len(closed)} candles ({closed[0][0]}..{closed[-1][0]})"
                  )
                  total += len(closed)

          db.close()
          print(f"CACHE_IMPORT_OK symbols={len(symbols)} pairs={len(symbols)*2} candles={total}")
          PY
      - name: Scan all symbols
        run: python scan.py
      - name: Commit complete signals and candle cache
        run: |
          git config user.name "vegas-bot"
          git config user.email "vegas-bot@users.noreply.github.com"
          set -euo pipefail
          git fetch origin main
          local_sha=$(git rev-parse HEAD)
          remote_sha=$(git rev-parse origin/main)
          if [ "$local_sha" != "$remote_sha" ]; then
            echo "STALE_COMMIT_BLOCKED: main advanced during scan; refusing to publish this result"
            exit 1
          fi
          git add signals.json data
          if git diff --cached --quiet; then
            echo "No signals or cache changes to commit"
          else
            git commit -m "signals $(date -u +%FT%TZ)"
            git push origin HEAD:main
          fi
      - name: Wake Bark after scan completion (event only; no notification sent here)
        if: always()
        env:
          TOKEN: ${{ secrets.BARK_REPO_TOKEN }}
          SCAN_JOB_STATUS: ${{ job.status }}
          SCANNER_RECOVERY: ${{ inputs.bark_recovery || false }}
        run: |
          test -n "$TOKEN" || { echo "BARK_REPO_TOKEN is missing"; exit 1; }
          payload=$(python -c 'import json,os; print(json.dumps({"event_type":"vegas-signals","client_payload":{"scanner_job_status":os.environ["SCAN_JOB_STATUS"],"scanner_run_id":os.environ["GITHUB_RUN_ID"],"scanner_run_attempt":os.environ["GITHUB_RUN_ATTEMPT"],"scanner_recovery":os.environ.get("SCANNER_RECOVERY","false").lower()=="true"}}))')
          set -euo pipefail
          status=$(curl --silent --show-error --output /tmp/bark-dispatch-body --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/MraJJqq/bark/dispatches \
            --data "$payload")
          body=$(cat /tmp/bark-dispatch-body)
          case "$status" in
            2??) echo "Bark wake event accepted (HTTP $status)" ;;
            *) echo "Bark wake event failed (HTTP $status): $body"; exit 1 ;;
          esac
