name: vegas-scan

on:
  schedule:
    # 北京时间 08:05 / 10:05 / 16:05 / 20:05 / 22:05
    - cron: "5 0,2,8,12,14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vegas-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests
      - name: Validate scanner and symbol list
        run: |
          python -m py_compile scan.py
          count=$(grep -Ev '^[[:space:]]*(#|$)' symbols.txt | sort -u | wc -l)
          test "$count" -eq 22
      - name: Scan all symbols
        run: python scan.py
      - name: Commit complete signals and candle cache
        run: |
          git config user.name "vegas-bot"
          git config user.email "vegas-bot@users.noreply.github.com"
          git add signals.json data
          git diff --cached --quiet || (git commit -m "signals $(date -u +%FT%TZ)" && git push)
      - name: Dispatch completed scan to Bark
        env:
          TOKEN: ${{ secrets.BARK_REPO_TOKEN }}
        run: |
          test -n "$TOKEN" || { echo "BARK_REPO_TOKEN is missing"; exit 1; }
          response=$(curl --silent --show-error --write-out '\n%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/MraJJqq/bark/dispatches \
            --data '{"event_type":"vegas-signals"}')
          status="${response##*$'\n'}"
          body="${response%$'\n'*}"
          case "$status" in
            2??) echo "Bark dispatch accepted (HTTP $status)" ;;
            *) echo "Bark dispatch failed (HTTP $status): $body"; exit 1 ;;
          esac
